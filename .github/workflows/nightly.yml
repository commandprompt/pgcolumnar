# pgColumnar nightly deep gate (issue #243).
#
# The per-PR gate (build-and-test.yml) is deliberately fast: build on 15-18, run
# the suites on 17 and 18. This workflow runs the coverage that is too heavy for
# every PR, once a day and on demand:
#
#   - the full packaged suite matrix (15, 16, 17, 18), so a behaviour, WAL, or
#     access-method divergence on 15/16 is caught automatically rather than only
#     by the local by-hand matrix;
#   - the clang ASAN+UBSAN sanitizer gate, the only gate that catches the
#     non-faulting memory-safety class the assert builds provably miss (issue
#     #225). An instrumented PostgreSQL build is expensive, so it is cached and
#     rebuilt only when test/build_san.sh or the pinned major changes.
#
# PostgreSQL 19 is beta and not in PGDG stable, so it stays a local gate.

name: nightly deep gate

on:
  # A tag runs the deep gate as well as the per-PR one. Beta 1 criterion 2 names
  # both this workflow's matrix and its sanitizer gate, and asks for them green
  # on the tag; a schedule cannot deliver that, because the nightly that follows
  # a tag runs against whatever main holds by then.
  #
  # concurrency below is group: nightly with cancel-in-progress: false, so a tag
  # run queues behind a scheduled one instead of killing it. The per-job
  # `if: github.event_name == 'workflow_dispatch' || github.repository == ...`
  # guards already admit a push on the canonical repository, so they need no
  # change: a tag push there satisfies the second clause, and a fork still skips.
  push:
    tags: ['v*']
  schedule:
    - cron: "0 6 * * *" # nightly, 06:00 UTC
  workflow_dispatch:
    inputs:
      fire_drill:
        description: "Exercise the red-nightly reporter without breaking anything"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Full packaged suite matrix. Same suites the per-PR gate runs on 17/18, here
  # across every packaged major so 15 and 16 are covered too.
  suites:
    name: suites (PG ${{ matrix.pg }}, ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # A FIRE DRILL SKIPS THE HEAVY GATES. The drill exists to prove the reporter
    # fires, and a proof that costs a full deep gate is one nobody re-runs -- which
    # is how a notifier goes back to never having been seen to fire. `skipped` is
    # not a failure to the reporter, so the drill's verdict comes from the input.
    if: (github.event_name == 'workflow_dispatch' || github.repository == 'commandprompt/pgcolumnar')
      && github.event.inputs.fire_drill != 'true'
    strategy:
      fail-fast: false
      # The full packaged matrix on x86_64, and the current major on aarch64.
      #
      # aarch64 runs the suites rather than only building, because the defect
      # class a second architecture actually adds is one no x86_64 run can show:
      # x86_64 orders stores more strictly than aarch64, so a missing barrier in
      # concurrent code is invisible on one and a defect on the other. The suites
      # that would show it are the concurrent ones, and they need to execute, not
      # compile.
      #
      # One major rather than four, because that defect class is a property of
      # this extension's own code rather than of a PostgreSQL version boundary,
      # and a nightly that takes four times as long to say the same thing is a
      # nightly people start ignoring.
      matrix:
        include:
          - { pg: '15', runner: ubuntu-latest }
          - { pg: '16', runner: ubuntu-latest }
          - { pg: '17', runner: ubuntu-latest }
          - { pg: '18', runner: ubuntu-latest }
          - { pg: '18', runner: ubuntu-24.04-arm }
    steps:
      # fetch-depth: 2, not the default 1, because the ledger gate needs a prior
      # ceiling and `HEAD~1` does not exist in a shallow checkout (#1104).
      # Measured: at depth 1 `git rev-parse HEAD~1` fails, at depth 2 it resolves.
      # `upgrade-guard` already takes 0 for its tags, and it was the only job
      # running this matrix that passed the night this broke.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The packages are ~102 MB, of which ~91 MB is the LLVM toolchain that
      # postgresql-server-dev-N depends on. That download is what stalls: every
      # failure of this step sat at the 600s bound while every success finished
      # in a median of 25s (#386). Caching the debs removes the download on a
      # hit, and a miss degrades to exactly what happens today.
      #
      # The runner image is folded into the hash below, not into the literal key.
      # A new image can bring a different LLVM major, and a key that ignored it
      # would serve debs for the wrong one. It was in the literal key as
      # ${{ env.ImageOS }} and expanded to NOTHING every time: ImageOS is a
      # runner environment variable, and the env context only carries variables
      # set by the workflow, job, or step. The observed key was
      # apt-pgdev-codecs-pg15-Linux-X64--v1, with an empty component between the
      # two dashes. The shell in the hash step can see $ImageOS; an expression
      # context cannot.
      - name: Add the PGDG repository and refresh the package lists
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo timeout 300 apt-get -o Acquire::Retries=5 update

      # See ci.yml's build job for why the key hashes the resolved versions: a
      # fixed key freezes the archives, and the next routine PGDG minor then
      # turns the download assertion below into a false red.
      - name: Derive the cache key from the versions apt will install
        id: aptkey
        run: |
          set -euo pipefail
          v=$(apt-cache policy \
                postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} \
                liblz4-dev libzstd-dev zlib1g-dev python3-pip \
              | awk '/Candidate:/ {print $2}' | sort)
          # $ImageOS, from the shell, where it actually has a value. Reported
          # rather than only hashed, so an empty one is visible in the log
          # instead of silently hashing to a constant.
          echo "runner image: ${ImageOS:-<empty>}   candidates:"; echo "$v" | sed 's/^/  /'
          # Both inputs must be non-empty; see ci.yml's build job for why a
          # placeholder instead of a failure is how this protection goes missing.
          test -n "$v"
          test -n "${ImageOS:-}"
          h=$(printf '%s\n%s\n' "$ImageOS" "$v" | md5sum | cut -c1-12)
          echo "k=$h" >> "$GITHUB_OUTPUT"
          echo "cache key hash: $h"

      - name: Cache the PostgreSQL ${{ matrix.pg }}, codec headers, and pyarrow packages
        id: apt-nightly
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-pgdev-codecs-pyarrow-pg${{ matrix.pg }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.aptkey.outputs.k }}-v3
          restore-keys: |
            apt-pgdev-codecs-pyarrow-pg${{ matrix.pg }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install PostgreSQL ${{ matrix.pg }}, codec headers, and pyarrow
        run: |
          set -euo pipefail
          mkdir -p "$HOME/apt-archives/partial"
          sudo timeout 600 apt-get -o Acquire::Retries=5 \
            -o Dir::Cache::archives="$HOME/apt-archives" install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} \
            liblz4-dev libzstd-dev zlib1g-dev python3-pip 2>&1 | tee /tmp/apt-install.log
          # pyarrow for root (the suites run under sudo); the silent-skip trap the
          # per-PR workflow documents applies here too.
          sudo pip3 install --break-system-packages --quiet pyarrow \
            || sudo pip3 install --quiet pyarrow
          # Not "|| true": a failed chown means the save fails, the cache is
          # never populated, there is never a hit, and the assertion below never
          # fires because it is gated on a hit. See ci.yml for the long form.
          sudo chown -R "$USER" "$HOME/apt-archives"
          test -r "$HOME/apt-archives"
          # A cache that populates but never hits looks identical in the log to one
          # that works: the job is simply still slow. So assert it. On an exact
          # hit, apt must not have fetched anything over the network. A
          # restore-keys prefix match reports false here and is meant to.
          if [ "${{ steps.apt-nightly.outputs.cache-hit }}" = "true" ] \
             && grep -qE '^Get:[0-9]+ https?://' /tmp/apt-install.log; then
            echo "::error::apt cache reported a hit but packages were downloaded anyway"
            grep -E '^Get:[0-9]+ https?://' /tmp/apt-install.log
            exit 1
          fi

      - name: Confirm pyarrow is importable by the suites' interpreter
        run: |
          set -euo pipefail
          python3 -c 'import pyarrow, pyarrow.parquet; print("pyarrow", pyarrow.__version__)'
          sudo python3 -c 'import pyarrow, pyarrow.parquet; print("pyarrow as root ok")'

      - name: Resolve the object-storage suite host names
        # objstore_addressing and objstore_listing exercise virtual-host-style
        # S3 addressing (pgc-bucket.s3.local) against their own loopback
        # fixture server. The names must resolve; a suite whose capability
        # check fails is a FAILURE unless explicitly waived (pgc_skip), so
        # resolution is part of the environment the gate provides.
        run: echo "127.0.0.1 s3.local pgc-bucket.s3.local" | sudo tee -a /etc/hosts

      - name: Stop the packaged cluster
        run: sudo systemctl stop postgresql || true

      - name: Run the suite matrix on PG ${{ matrix.pg }}
        run: |
          set -euo pipefail
          # PGC_REQUIRE_ISOLATION makes a missing pg_isolation_regress fail rather
          # than skip (#247); timing suites are dropped on shared runners.
          sudo -E env "PATH=$PATH" PGC_SKIP_TIMING=1 PGC_JOBS=4 \
            PGC_REQUIRE_ISOLATION=1 PGC_LEDGER_AGAINST=parent \
            bash test/run_all_versions.sh /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Collect logs on failure
        if: failure()
        run: |
          # /tmp/pgcolumnar-logs, not the build directory: run_all_versions.sh
          # copies each suite's log there and then removes the builddir, so a
          # glob of the builddir alone runs after the path is gone and prints
          # nothing. ci.yml was fixed for this on #918; this workflow was not,
          # and collected nothing on three consecutive aarch64 reds (#1248).
          # A FAILING SUITE'S LOG IS PRINTED WHOLE; A PASSING ONE IS NOT PRINTED
          # AT ALL (#1248). `tail -60` was too small for the suite that needed
          # it: harness_selftest emits 2452 lines and its hand-rebuild premise
          # sits 76 from the end, so the window missed the failure -- and the
          # diagnosis printed just after it -- by 16 lines. Raising the number
          # would go stale the next time a part is added after 590, which is
          # how it went stale the first time.
          #
          # Printing only the logs that carry a FAIL is also far less output:
          # 268 tails of 60 is ~16000 lines of mostly passing suites, against
          # one failing suite's 2452 that actually contains the answer.
          for f in /tmp/pgcolumnar-logs/*.log /tmp/pgcolumnar-matrix-*/*.log; do
            [ -e "$f" ] || continue
            # awk, not grep: this is the SAME expression used to validate the
            # selector, so the guard and its check cannot disagree -- which is
            # exactly what happened. The first version wrote `\t` in a POSIX
            # BRE, where GNU grep matches a literal `t`, so it selected nothing
            # on CI; and `if: failure()` means a green run never runs this step,
            # so it would have looked fixed until the next red printed nothing.
            awk -F'\t' '$5 == "FAIL" { found = 1 } END { exit !found }' "$f" || continue
            echo "===== $f (whole log: it carries a FAIL) ====="
            cat "$f"
          done

  # clang ASAN+UBSAN gate. Builds an instrumented PostgreSQL (cached) and runs the
  # write/read/encode/import subset against it with sanitizer violations fatal.
  sanitizer:
    name: sanitizer gate (ASAN+UBSAN)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # A FIRE DRILL SKIPS THE HEAVY GATES. The drill exists to prove the reporter
    # fires, and a proof that costs a full deep gate is one nobody re-runs -- which
    # is how a notifier goes back to never having been seen to fire. `skipped` is
    # not a failure to the reporter, so the drill's verdict comes from the input.
    if: (github.event_name == 'workflow_dispatch' || github.repository == 'commandprompt/pgcolumnar')
      && github.event.inputs.fire_drill != 'true'
    env:
      PG_VERSION: "18.4"
      SAN_PREFIX: /home/runner/pg_san
    steps:
      - uses: actions/checkout@v4

      - name: Install clang, build tools, codec headers, pyarrow; create the postgres user
        run: |
          set -euo pipefail
          sudo timeout 300 apt-get -o Acquire::Retries=5 update
          sudo timeout 600 apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            clang llvm bison flex make perl \
            liblz4-dev libzstd-dev zlib1g-dev python3-pip
          clang --version | head -1
          # A system pip install (root) lands where every user's interpreter finds
          # it, including the postgres user the suites run as.
          sudo pip3 install --break-system-packages --quiet pyarrow \
            || sudo pip3 install --quiet pyarrow
          # The suites run as a dedicated unprivileged DB user, not root:
          # PostgreSQL refuses to run as root, and this job installs no package
          # that would create a postgres user, so make one.
          id postgres >/dev/null 2>&1 || sudo useradd -m postgres
          sudo -u postgres python3 -c 'import pyarrow, pyarrow.parquet; print("pyarrow ok for postgres")'

      - name: Resolve the object-storage suite host names
        # objstore_addressing and objstore_listing exercise virtual-host-style
        # S3 addressing (pgc-bucket.s3.local) against their own loopback
        # fixture server. The names must resolve; a suite whose capability
        # check fails is a FAILURE unless explicitly waived (pgc_skip), so
        # resolution is part of the environment the gate provides.
        run: echo "127.0.0.1 s3.local pgc-bucket.s3.local" | sudo tee -a /etc/hosts

      - name: Cache the instrumented PostgreSQL
        id: san-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SAN_PREFIX }}
          key: san-pg-${{ env.PG_VERSION }}-clang-${{ hashFiles('test/build_san.sh') }}-${{ runner.os }}

      - name: Build the ASAN+UBSAN PostgreSQL (on cache miss)
        if: steps.san-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 600 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/pg-src.tar.bz2 \
            "https://ftp.postgresql.org/pub/source/v${PG_VERSION}/postgresql-${PG_VERSION}.tar.bz2"
          # build_san.sh honours PGC_PG_TARBALL (source) and PGC_SAN_SRC (scratch)
          # and installs to the prefix argument; point all three at CI-writable
          # paths instead of its /root defaults.
          PGC_PG_TARBALL=/tmp/pg-src.tar.bz2 PGC_SAN_SRC=/tmp/pg_san_src \
            bash test/build_san.sh "$SAN_PREFIX"

      - name: Confirm the build is the expected sanitizer build
        run: |
          set -euo pipefail
          "$SAN_PREFIX/bin/pg_config" --version
          mkglobal="$("$SAN_PREFIX/bin/pg_config" --pgxs | xargs dirname | xargs dirname)/Makefile.global"
          grep -q -- '-fsanitize=address,undefined' "$mkglobal"
          grep -q -- '-fno-sanitize=function' "$mkglobal"
          echo "sanitizer flags present in Makefile.global"

      - name: Prepare the runtime and hand the build to postgres, proving it starts
        run: |
          set -euo pipefail
          # ASAN reserves a large shadow region at fixed offsets. On recent runner
          # kernels the default ASLR entropy (vm.mmap_rnd_bits) is high enough that
          # the shadow interleaves an existing mapping and the instrumented
          # postmaster aborts at startup. Lowering it is the standard workaround and
          # affects only this runner.
          sudo sysctl -w vm.mmap_rnd_bits=28
          # The suites run as postgres, and run_san.sh both writes the extension
          # into the prefix and builds it in the checkout, so postgres must own both
          # and be able to traverse to the prefix under /home/runner.
          sudo chmod o+x /home/runner
          sudo chown -R postgres "$SAN_PREFIX" "$GITHUB_WORKSPACE"
          # Prove the instrumented server starts as postgres, with ASAN_OPTIONS
          # passed via env (not a login shell, which would strip it), before the
          # suites -- so a startup failure is diagnosed here, not hidden behind 23
          # "start attempt failed" lines.
          sudo -u postgres env \
            SAN_PREFIX="$SAN_PREFIX" \
            ASAN_OPTIONS="detect_leaks=0:detect_stack_use_after_return=0:abort_on_error=1" \
            bash -ec '
              d="$(mktemp -d)"
              "$SAN_PREFIX/bin/initdb" -D "$d/data" -A trust >/tmp/san-smoke.log 2>&1
              "$SAN_PREFIX/bin/pg_ctl" -D "$d/data" -w \
                -o "-p 5599 -c listen_addresses=127.0.0.1" -l "$d/logfile" start >>/tmp/san-smoke.log 2>&1
              "$SAN_PREFIX/bin/pg_ctl" -D "$d/data" stop -m fast >>/tmp/san-smoke.log 2>&1
            ' || { echo "instrumented server failed to start as postgres:"; sudo cat /tmp/san-smoke.log; exit 1; }
          echo "instrumented server starts cleanly as postgres"

      - name: Run the sanitizer gate (as the postgres user)
        run: |
          set -euo pipefail
          # As postgres, not root. PostgreSQL refuses to run as root, and dropping
          # from root via runuser strips ASAN_OPTIONS so the instrumented server
          # aborts on the leak/stack traps -- the failure the first CI run hit. As
          # postgres, pgc_setup's non-root path runs initdb/postmaster directly and
          # run_san.sh's exported ASAN_OPTIONS is inherited. -E keeps PATH.
          sudo -u postgres -E env "PATH=$PATH" bash test/run_san.sh "$SAN_PREFIX"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "===== ASAN start smoke log ====="; sudo cat /tmp/san-smoke.log 2>/dev/null || true
          for f in $(sudo find /tmp -maxdepth 4 -name server.log -path '*pgcolumnar*' 2>/dev/null); do
            echo "===== $f ====="; sudo tail -60 "$f"
          done

  # Line and branch coverage, published as an artifact and nothing else.
  #
  # Deliberately not a gate: no threshold, no badge, and a drop cannot fail a
  # pull request. A coverage threshold creates pressure to write tests that
  # execute lines rather than tests that prove properties, and the assertions in
  # this project's suites are the reason its defects get found. The report
  # answers the question a passing suite cannot: which code does nothing execute
  # at all.
  #
  # The number will look unremarkable and that is correct. A table access method
  # carries defensive branches that should never be taken, and columnar_compat.h
  # carries version shims of which one arm compiles per major.
  coverage:
    name: coverage report (PG 18)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A FIRE DRILL SKIPS THE HEAVY GATES. The drill exists to prove the reporter
    # fires, and a proof that costs a full deep gate is one nobody re-runs -- which
    # is how a notifier goes back to never having been seen to fire. `skipped` is
    # not a failure to the reporter, so the drill's verdict comes from the input.
    if: (github.event_name == 'workflow_dispatch' || github.repository == 'commandprompt/pgcolumnar')
      && github.event.inputs.fire_drill != 'true'
    steps:
      - uses: actions/checkout@v4

      # The packages are ~102 MB, of which ~91 MB is the LLVM toolchain that
      # postgresql-server-dev-N depends on. That download is what stalls: every
      # failure of this step sat at the 600s bound while every success finished
      # in a median of 25s (#386). Caching the debs removes the download on a
      # hit, and a miss degrades to exactly what happens today.
      #
      # The runner image is folded into the hash below, not into the literal key.
      # A new image can bring a different LLVM major, and a key that ignored it
      # would serve debs for the wrong one. It was in the literal key as
      # ${{ env.ImageOS }} and expanded to NOTHING every time: ImageOS is a
      # runner environment variable, and the env context only carries variables
      # set by the workflow, job, or step. The observed key was
      # apt-pgdev-codecs-pg15-Linux-X64--v1, with an empty component between the
      # two dashes. The shell in the hash step can see $ImageOS; an expression
      # context cannot.
      - name: Add the PGDG repository and refresh the package lists
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo timeout 300 apt-get -o Acquire::Retries=5 update

      # See ci.yml's build job for why the key hashes the resolved versions: a
      # fixed key freezes the archives, and the next routine PGDG minor then
      # turns the download assertion below into a false red.
      - name: Derive the cache key from the versions apt will install
        id: aptkey
        run: |
          set -euo pipefail
          v=$(apt-cache policy \
                postgresql-18 postgresql-server-dev-18 \
                liblz4-dev libzstd-dev zlib1g-dev python3-pip lcov \
              | awk '/Candidate:/ {print $2}' | sort)
          # $ImageOS, from the shell, where it actually has a value. Reported
          # rather than only hashed, so an empty one is visible in the log
          # instead of silently hashing to a constant.
          echo "runner image: ${ImageOS:-<empty>}   candidates:"; echo "$v" | sed 's/^/  /'
          # Both inputs must be non-empty; see ci.yml's build job for why a
          # placeholder instead of a failure is how this protection goes missing.
          test -n "$v"
          test -n "${ImageOS:-}"
          h=$(printf '%s\n%s\n' "$ImageOS" "$v" | md5sum | cut -c1-12)
          echo "k=$h" >> "$GITHUB_OUTPUT"
          echo "cache key hash: $h"

      - name: Cache the PostgreSQL 18, codec headers, lcov, and pyarrow packages
        id: apt-coverage
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-pgdev-codecs-lcov-pyarrow-pg18-${{ runner.os }}-${{ runner.arch }}-${{ steps.aptkey.outputs.k }}-v3
          restore-keys: |
            apt-pgdev-codecs-lcov-pyarrow-pg18-${{ runner.os }}-${{ runner.arch }}-

      - name: Install PostgreSQL 18, codec headers, lcov, and pyarrow
        run: |
          set -euo pipefail
          mkdir -p "$HOME/apt-archives/partial"
          sudo timeout 600 apt-get -o Acquire::Retries=5 \
            -o Dir::Cache::archives="$HOME/apt-archives" install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18 \
            liblz4-dev libzstd-dev zlib1g-dev python3-pip lcov 2>&1 | tee /tmp/apt-install.log
          # Installed with sudo because the suites run under sudo; a plain
          # pip3 install lands in ~/.local where root cannot see it, which is how
          # the Arrow and Parquet suites once reported PASS while skipping.
          sudo pip3 install --break-system-packages --quiet pyarrow \
            || sudo pip3 install --quiet pyarrow
          sudo python3 -c 'import pyarrow, pyarrow.parquet; print("pyarrow as root ok")'
          # Not "|| true": a failed chown means the save fails, the cache is
          # never populated, there is never a hit, and the assertion below never
          # fires because it is gated on a hit. See ci.yml for the long form.
          sudo chown -R "$USER" "$HOME/apt-archives"
          test -r "$HOME/apt-archives"
          # A cache that populates but never hits looks identical in the log to one
          # that works: the job is simply still slow. So assert it. On an exact
          # hit, apt must not have fetched anything over the network. A
          # restore-keys prefix match reports false here and is meant to.
          if [ "${{ steps.apt-coverage.outputs.cache-hit }}" = "true" ] \
             && grep -qE '^Get:[0-9]+ https?://' /tmp/apt-install.log; then
            echo "::error::apt cache reported a hit but packages were downloaded anyway"
            grep -E '^Get:[0-9]+ https?://' /tmp/apt-install.log
            exit 1
          fi

      - name: Resolve the object-storage suite host names
        # objstore_addressing and objstore_listing exercise virtual-host-style
        # S3 addressing (pgc-bucket.s3.local) against their own loopback
        # fixture server. The names must resolve; a suite whose capability
        # check fails is a FAILURE unless explicitly waived (pgc_skip), so
        # resolution is part of the environment the gate provides.
        run: echo "127.0.0.1 s3.local pgc-bucket.s3.local" | sudo tee -a /etc/hosts

      - name: Stop the packaged cluster
        run: sudo systemctl stop postgresql || true

      - name: Build instrumented and run the suites
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" \
            bash test/run_coverage.sh /usr/lib/postgresql/18/bin/pg_config

      # The per-suite logs, which were never uploaded. Only coverage/html and
      # coverage.info were, so when a suite failed inside this job the detail
      # went away with the runner and the tally line was all anyone could see.
      # That is how #741's failing suite stayed invisible: the job printed
      # "1 failed ( extension_upgrade)" every night and the reason was
      # unreachable. `if: always()` because a failed run is exactly when they
      # are wanted.
      - name: Upload the per-suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-suite-logs
          path: coverage/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 14

      - name: Upload the tracefile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage/coverage.info
          retention-days: 14

  # The extension-upgrade guard (#382), which until #741 ran nowhere.
  #
  # What it catches is invisible to a build and to every other job here: each
  # SQL-callable function records its C link name in pg_proc.prosrc at CREATE
  # EXTENSION time, so renaming a link name leaves every EXISTING install
  # pointing at a symbol the new library no longer exports. It compiles, it
  # links, every suite passes on a fresh install, and every upgraded install is
  # inert. Only a real previous release, carrying data, upgraded in place, shows
  # it.
  #
  # Nightly rather than per-PR: it builds the extension twice, and the suite's
  # own header calls it a second gate beside the matrix rather than part of it.
  upgrade-guard:
    name: extension upgrade guard (PG 18)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A FIRE DRILL SKIPS THE HEAVY GATES. The drill exists to prove the reporter
    # fires, and a proof that costs a full deep gate is one nobody re-runs -- which
    # is how a notifier goes back to never having been seen to fire. `skipped` is
    # not a failure to the reporter, so the drill's verdict comes from the input.
    if: (github.event_name == 'workflow_dispatch' || github.repository == 'commandprompt/pgcolumnar')
      && github.event.inputs.fire_drill != 'true'
    # Named ONCE. Two steps consume it, and a tag spelled separately in each is
    # the kind of duplication that goes stale in one place and not the other.
    env:
      PGC_OLD_TAG: v1.0-alpha
    steps:
      # fetch-depth: 0 for the tags. The coverage job's plain checkout is why
      # this suite could not resolve its old source at all (#741): actions/checkout
      # fetches no tags by default, and the suite's ref fallback then fails.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Asserted, and asserted BEFORE the expensive setup, because "the old
      # source was not available" is precisely the state that made this guard
      # look like it was running when it was not. A tagless checkout must be a
      # loud red here, never a skip.
      - name: Confirm the previous release is present
        run: |
          set -euo pipefail
          git rev-parse --verify -q "$PGC_OLD_TAG^{commit}"
          echo "$PGC_OLD_TAG resolves to $(git rev-parse "$PGC_OLD_TAG^{commit}")"

      # The DIRECTORY form, which the suite documents, rather than its git-ref
      # form. The suite runs under sudo (its runpg is an unconditional
      # `runuser -u postgres`), and a root `git clone` of a workspace owned by
      # the runner user trips git's dubious-ownership refusal. `git archive` runs
      # as the ordinary user and yields a plain tree with no .git, which is
      # exactly the case the directory form exists for.
      #
      # Passing it explicitly also sets the suite's EXPLICIT flag, so its
      # "not a git checkout" SKIP branch is unreachable from here. A guard that
      # can quietly skip is the failure this job exists to end.
      - name: Materialise the previous release as a plain tree
        run: |
          set -euo pipefail
          rm -rf /tmp/pgc_old_alpha
          mkdir -p /tmp/pgc_old_alpha
          git archive "$PGC_OLD_TAG" | tar -x -C /tmp/pgc_old_alpha
          test -f /tmp/pgc_old_alpha/Makefile
          echo "old source: $(find /tmp/pgc_old_alpha -maxdepth 1 | wc -l) top-level entries"

      - name: Add the PGDG repository and refresh the package lists
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo timeout 300 apt-get -o Acquire::Retries=5 update

      - name: Install PostgreSQL 18 and the codec headers
        run: |
          set -euo pipefail
          sudo timeout 600 apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18 \
            liblz4-dev libzstd-dev zlib1g-dev

      - name: Stop the packaged cluster
        run: sudo systemctl stop postgresql || true

      # Exit 2 is the suite's "the environment could not supply an old source".
      # run_all_versions.sh maps that to SKIP, which is right for a developer's
      # box and wrong here: this job's entire purpose is that the guard actually
      # ran, so an environment shortfall is a failure of the job, not a waiver.
      - name: Run the extension-upgrade guard
        run: |
          # `set +e`, NOT `set -uo pipefail`. GitHub runs a `run:` step as
          # `bash -e {0}`, and -uo pipefail does not cancel that -e: the step
          # would abort at the suite line and rc, the annotation and the exit
          # below would never execute. The gate still held -- a non-zero exit
          # fails the job either way -- but the one case the comment singles out
          # was the one case that could never announce itself. Only `set +e`
          # restores the intent (#741 review).
          set +e
          sudo -E env "PATH=$PATH" \
            bash test/extension_upgrade.sh \
              /usr/lib/postgresql/18/bin/pg_config /tmp/pgc_old_alpha
          rc=$?
          if [ "$rc" = 2 ]; then
            echo "::error::the guard skipped for want of an old source; in this job that is a failure"
          fi
          exit "$rc"

  # ---- make a red nightly findable without knowing to look (#973) -----------
  #
  # The deep gate ran red two nights and nothing surfaced it; before that, 25
  # consecutive nights. A scheduled run has no pull request to be red on, the job
  # that failed is named like a reporting step rather than a gate, and GitHub
  # notifies the ACTOR of a schedule event -- whoever last touched this file, not
  # whoever broke it.
  #
  # `if: always()` and not `if: failure()`, because the GREEN path is half the
  # mechanism: an alert that must be closed by hand becomes one nobody closes.
  #
  # THE VERDICT COMES FROM needs.*.result, WHICH CANNOT BE LATE. The failing job
  # NAMES come from the run's own API, because `needs` keys say `coverage` where a
  # reader needs `coverage report (PG 18)` -- and if that call fails the verdict
  # still stands and the body says no name was reported, rather than reporting a
  # green.
  # THE PYTEST CORPUS ON THE SAME MAJORS AS THE SHELL ONE (#1163). The two halves
  # assert the same properties, and this half ran on PG 18 alone while the shell
  # corpus ran the matrix below -- so a red on 15 had no baseline anywhere, and
  # building one from scratch is what it cost when it happened.
  #
  # THE MATRIX MATCHES `suites` ABOVE, DELIBERATELY. 15, 16, 17 and 18 is what the
  # shell half runs here; PG 19 is in neither half of this workflow, only as a
  # from-source BUILD in ci.yml, so matching this list keeps the two halves
  # aligned rather than inventing a gap in the other direction. Adding 19 means
  # adding a from-source server to this workflow, which is its own change.
  #
  # PR CI runs 17 and 18 of this same job. The ends of the range are what this one
  # adds, and the ends are where the gap was.
  capability-sweep:
    name: capability name-set sweep (PG 18)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A FIRE DRILL SKIPS THE HEAVY GATES, as for the other deep jobs.
    if: (github.event_name == 'workflow_dispatch' || github.repository == 'commandprompt/pgcolumnar')
      && github.event.inputs.fire_drill != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Add the PGDG repository and refresh the package lists
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo timeout 300 apt-get -o Acquire::Retries=5 update

      - name: Install PostgreSQL 18, the codec headers, and pyarrow
        run: |
          set -euo pipefail
          sudo timeout 600 apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            postgresql-18 postgresql-server-dev-18 \
            liblz4-dev libzstd-dev zlib1g-dev python3-pip
          sudo pip3 install --break-system-packages --quiet pyarrow \
            || sudo pip3 install --quiet pyarrow

      # THE SWEEP'S SUBJECT IS THE ABSENCE OF pyarrow, so its PRESENCE is this
      # job's precondition. Without it every suite takes the absent path in both
      # runs, every name set matches trivially, and the sweep passes having
      # compared nothing -- its pass and its vacuity look identical. The sweep
      # asserts this itself; the job asserts it too, because a job that installs
      # a dependency should fail where the install failed rather than four
      # minutes later inside a guard.
      - name: Confirm pyarrow is importable by the suites' interpreter
        run: |
          set -euo pipefail
          sudo python3 -c 'import pyarrow; print("pyarrow", pyarrow.__version__)'

      - name: Stop the packaged cluster
        run: sudo systemctl stop postgresql || true

      # NOT a registered suite and NOT behind PGC_SKIP_TIMING. Two runs of 30
      # suites is 224 seconds, which is a nightly rather than something every leg
      # of every PR pays; and ci.yml and nightly.yml both set PGC_SKIP_TIMING, so
      # a guard behind that variable never runs anywhere.
      - name: Run the capability name-set sweep
        run: |
          sudo -E env "PATH=$PATH" \
            bash test/capability_sweep.sh /usr/lib/postgresql/18/bin/pg_config

  pytest-cluster:
    name: pytest (cluster tests, PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16', '17', '18']
    steps:
      - uses: actions/checkout@v4

      - name: Add the PGDG repository and install PostgreSQL ${{ matrix.pg }} with its headers
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          # Bounded and retried, for the reason the suites job gives: a plain
          # "curl -fsSL" waits indefinitely on a stalled connection, which hung a
          # step for 40 minutes on an otherwise healthy runner (#351).
          sudo curl -fsSL --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo timeout 300 apt-get -o Acquire::Retries=5 update
          sudo timeout 600 apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} \
            liblz4-dev libzstd-dev zlib1g-dev
          # NOT cached, deliberately. The suites job caches because it runs a matrix for
          # an hour; a second copy of that cache-key derivation is a thing that goes
          # stale silently, and this job is minutes long.

      # ASSERTED, not assumed. A missing pg_config would otherwise surface as a
      # confusing failure inside conftest's build rather than here.
      - name: check the pg_config the tests will be given
        run: |
          set -euo pipefail
          PGC="/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config"
          test -x "$PGC"
          echo "pg_config: $PGC"
          "$PGC" --version
          # pgc_cluster.py runs initdb as THIS user; root cannot, and the runner is not
          # root. Said out loud because it is the assumption that breaks on a
          # container.
          echo "running as: $(id -un) (uid $(id -u))"
          test "$(id -u)" -ne 0

      # MAKE THE INSTALL TARGETS WRITABLE, because this job must stay non-root and
      # therefore cannot install. `make install` writes the .so to pkglibdir and the
      # control/SQL files to sharedir/extension, both root-owned on a PGDG install, so the
      # first run of this job failed inside conftest's build with
      #
      #     RuntimeError: pgcolumnar failed to build or install from ...;
      #                   refusing to report checks against whatever was installed before.
      #
      # Diagnosed by @jdatcmd, who also named why the suites job does not hit it: that one
      # runs the whole matrix under `sudo -E` and lib.sh drops to `runuser -u postgres` for
      # what must not be root. The pytest harness has no equivalent drop, so it is non-root
      # throughout -- initdb refuses to run as root, so it has to be.
      #
      # Of the three ways out, this is the one that KEEPS the non-root assertion above,
      # which is a decision rather than an accident.
      - name: make the extension's install targets writable by this user
        run: |
          set -euo pipefail
          PGC="/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config"
          LIB="$("$PGC" --pkglibdir)"
          SHARE="$("$PGC" --sharedir)"
          sudo chown -R "$(id -un)" "$LIB" "$SHARE"
          # ASSERTED, not assumed. A chown that changed nothing would surface as the same
          # opaque build failure this step exists to remove, two steps later and in
          # somebody else's traceback.
          test -w "$LIB"
          test -w "$SHARE/extension"
          echo "writable by $(id -un): $LIB and $SHARE/extension"

      - name: install pytest and the driver, pinned from requirements-test.txt
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pgcvenv
          # EVERY pin, including psycopg, which is what makes this job the other half of
          # pytest-guards. Installing "whatever the runner carries" is what
          # requirements-test.txt exists to prevent.
          /tmp/pgcvenv/bin/pip install --quiet -r test/pytest/requirements-test.txt
          # The control for pytest-guards' own assertion: that job proves the guard
          # files need no driver by its ABSENCE, so this one states its presence.
          /tmp/pgcvenv/bin/pip show psycopg >/dev/null

      - name: run the tests that need a cluster
        run: |
          set -euo pipefail
          cd test/pytest
          # THE COMPLEMENT of NO_CLUSTER, derived rather than written here. A second
          # hand-maintained copy of which file needs a database goes stale silently,
          # which is why pytest-guards derives its list from the same place.
          FILES="$(python3 -c 'import sys, pathlib; sys.path.insert(0, "."); from test_harness_deps import NO_CLUSTER; print(" ".join(p.name for p in sorted(pathlib.Path(".").glob("test_*.py")) if p.name not in NO_CLUSTER))')"
          test -n "$FILES"
          WANT="$(awk '$1=="cluster_tests"{print $2}' expected_tests.txt)"
          test -n "$WANT"
          echo "running $(set -- $FILES; echo $#) cluster file(s): $FILES"
          echo "expecting $WANT collected test(s)"
          PYTHONPATH=. /tmp/pgcvenv/bin/pytest -q \
            --pg-config /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config \
            --pgc-expect-tests "$WANT" \
            $FILES

  red-nightly:
    name: report a red nightly
    runs-on: ubuntu-latest
    needs: [suites, sanitizer, coverage, upgrade-guard, capability-sweep, pytest-cluster]
    if: always() && (github.event_name == 'workflow_dispatch' || github.repository == 'commandprompt/pgcolumnar')
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: open, update or close the nightly's issue
        env:
          GH_TOKEN: ${{ github.token }}
          # ONE LIST, NOT TWO. An earlier version named the four results in four
          # environment variables, which meant `needs:` was guarded by selftest 450
          # and the verdict was computed from a second list guarded by nothing --
          # so a contributor adding a gate was compelled to update the guarded list
          # and told nothing about the one that decided the verdict
          # (@OffgridwithJD, who added a fifth job and got a fully green tree with
          # a nightly whose failure this could not see).
          #
          # toJSON(needs) carries every entry, so there is nothing to keep in
          # agreement.
          NEEDS_JSON: ${{ toJSON(needs) }}
          DRILL: ${{ github.event.inputs.fire_drill }}
        run: |
          set -euo pipefail
          # THE DRILL SUBSTITUTES THE INPUT, NOT THE ANSWER. An earlier version set
          # verdict=failure directly, which meant the drill proved delivery and
          # never touched the decision -- and the decision is the half that can
          # fail the #973 way. It now feeds a synthetic context through the same
          # derivation every real night uses.
          # THE REAL CONTEXT IS PRINTED FIRST, ALWAYS, INCLUDING ON A DRILL.
          # The whole fix rests on toJSON(needs) carrying every entry, and that was
          # an assumption about the platform rather than something anyone had seen.
          # Printing it makes every run -- including the cheap drill -- an
          # observation of it: a drill shows all four gates as `skipped`, so a gate
          # missing from this line is visible without waiting for a real red.
          echo "needs context as given: $NEEDS_JSON"
          needs_json="$NEEDS_JSON"
          if [ "${DRILL:-false}" = "true" ]; then
            needs_json='{"fire-drill":{"result":"failure"}}'
            echo "fire drill: substituting a failing context through the same derivation"
            # AND THE ISSUE MUST SAY IT IS A DRILL. Drill 3 did not: rewriting this
            # step dropped the marker, the job list came back empty, and the body
            # read exactly like a genuine red. An alert that cries wolf teaches a
            # reader to discount it, which is the state #973 exists to leave.
            drill_name="fire drill for #973: no gate actually failed"
          fi
          echo "verdict computed from: $needs_json"

          names=()
          while IFS= read -r n; do [ -n "$n" ] && names+=("$n"); done < <(
            # SELECT WHAT FAILED, NOT WHAT DID NOT SUCCEED. The first version
            # filtered negatively and the first fire drill caught it: this job is
            # still RUNNING when it asks, so it did not match "success" and listed
            # ITSELF as a failing job. A positive list cannot admit a state nobody
            # enumerated -- and where it OMITS one (neutral, action_required,
            # stale), the reporter says no job name was reported rather than
            # printing an empty list.
            gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .name' 2>/dev/null || true)

          [ -n "${drill_name:-}" ] && names+=("$drill_name")
          .github/scripts/nightly-report.sh --from-needs "$needs_json" ${names+"${names[@]}"}
