# pgColumnar continuous integration.
#
# Two per-PR gates, matching the local cadence:
#   - a build preflight across every packaged major, which catches an API break;
#   - the suite matrix on the current majors (17 and 18), which catches a
#     behaviour break -- previously PG17 only (#236), 18 added to close #243.
#
# The heavier coverage runs nightly in .github/workflows/nightly.yml, not per-PR:
# the full packaged suite matrix (15-18) and the ASAN+UBSAN sanitizer gate -- the
# only gate that catches the non-faulting memory-safety class the assert builds
# miss. Per-PR stays fast; the deep coverage runs once a day and on demand.
#
# PostgreSQL 19 is beta and not packaged in PGDG at all, in stable, testing or
# snapshot, so it cannot be apt-installed here. It is still built here, from
# source and cached, because "cannot install" is not "cannot compile against" and
# the newest major is where header and API tightening lands. See the build-beta
# job for what that blindness cost. Its suites remain a local gate
# (test/run_all_versions.sh).
#
# Warnings are failures here for the same reason they are in the local matrix.

name: build and test

on:
  push:
    branches: [main]
    # Tags too, because the beta 1 entry test in design/RELEASE_PLAN_1.0.md asks
    # for a green matrix "on the tag itself, not on a branch", and nothing here
    # fired on a tag: v1.0-dev has no workflow run at all, and the runs against
    # v1.0-alpha and v1.0-alpha2 are push-to-main runs that happen to share the
    # commit. A criterion satisfiable only by remembering to dispatch one by hand
    # is not a gate. actions/checkout takes the triggering ref, so this run is
    # the tag's own.
    #
    # The duplicate run against a commit already built on main is the point
    # rather than waste: it is what binds a green result to the release
    # artifact. The concurrency group below keys on github.ref, and a tag ref is
    # not refs/heads/main, so the two do not cancel each other.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis of the test harness itself, errors only. The harness is
  # ~130 bash suites whose failure modes have their own gotcha literature
  # (harness_selftest polices the semantic ones, like assigning to a bash
  # special, #616 retracted); shellcheck at -S error catches the syntactic
  # class without demanding a warning cleanup of the whole corpus. -s bash
  # because the selftest parts are sourced fragments with no shebang.
  shellcheck:
    name: shellcheck (test harness, errors only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck -S error over the harness
        run: shellcheck -S error -s bash test/*.sh test/selftest/*.sh

  # The pytest harness's own guards, where they can actually run.
  #
  # THIS RUNS NO DATABASE AND BUILDS NOTHING. Most of test/pytest/ tests the
  # HARNESS rather than the product -- it drives pytest inside pytest to prove a
  # guard refuses what it claims to refuse. Those tests need an interpreter and
  # nothing else.
  #
  # NO COUNT IS WRITTEN HERE. One was, and it was wrong the day it was written:
  # the comment said 152 against a corpus of 154. The step below prints how many
  # files it ran and pytest prints how many tests passed, so the numbers reach a
  # reader from the run instead of from a sentence (#908).
  #
  # README.md records why the corpus is not in `SUITES`: pgc_skip treats a missing
  # dependency as a failure rather than a skip, so registering it there would
  # redden every job until the driver is installed everywhere. That argument is
  # about the CLUSTER tests. It never applied to the guard tests, and until
  # conftest deferred its psycopg import there was no way to separate them --
  # importing conftest imported the driver, so a run with no driver failed to
  # COLLECT rather than failing a test.
  #
  # THE FILE LIST AND THE PINS ARE BOTH DERIVED, NOT WRITTEN HERE. The list comes
  # from NO_CLUSTER in test_harness_deps.py and the pins from
  # requirements-test.txt, because a second copy of either is a thing that goes
  # stale silently -- which this repository has spent a lot of time proving.
  pytest-guards:
    name: pytest (harness guards, no database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install pytest, pinned from requirements-test.txt, WITHOUT the driver
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pgcvenv
          # Only the two runner packages. psycopg is deliberately absent: these
          # tests must not need it, and this job is what proves that.
          PINS="$(grep -E '^(pytest|pytest-xdist)==' test/pytest/requirements-test.txt)"
          test -n "$PINS"
          echo "$PINS"
          /tmp/pgcvenv/bin/pip install --quiet $PINS
          ! /tmp/pgcvenv/bin/pip show psycopg >/dev/null 2>&1
      - name: run the guard tests that need no cluster
        run: |
          set -euo pipefail
          cd test/pytest
          FILES="$(python3 -c 'import sys; sys.path.insert(0, "."); from test_harness_deps import NO_CLUSTER; print(" ".join(NO_CLUSTER))')"
          test -n "$FILES"
          # HOW MANY TESTS THIS MUST COLLECT, from the tracked file (#1016). pytest
          # exits 0 having collected nothing, so this job could pass with a bad file
          # list, an import error, or a rename that emptied the glob -- and did assert
          # nothing about its own size until now. `test -n` matters as much as the
          # number: an empty read would omit the flag and fail OPEN.
          WANT="$(awk '$1=="guard_tests"{print $2}' expected_tests.txt)"
          test -n "$WANT"
          # Printed, not stated: the count is a fact about the tree at this
          # commit, so it belongs in the output rather than in a comment.
          echo "running $(set -- $FILES; echo $#) database-free file(s): $FILES"
          echo "expecting $WANT collected test(s)"
          PYTHONPATH=. /tmp/pgcvenv/bin/pytest -q --pgc-expect-tests "$WANT" $FILES

  # THE OTHER HALF OF THE CORPUS (#1016). The files that need the driver and a cluster
  # ran in NO job: ci.yml had one pytest job and it installs psycopg deliberately NOT,
  # nightly.yml mentions pytest zero times, and run_all_versions.sh must mention it zero
  # times because the two harnesses stay independent. They passed when somebody ran them
  # by hand and nothing noticed when they stopped -- the shape of the nightly gate that
  # sat red for 25 nights behind a green PR gate.
  #
  # NO COUNT HERE, and the arm in test_harness_deps.py enforces that over this comment
  # as well as the job body: a number in a comment is the same hand-maintained derived
  # value as a number in a list, and the last one went stale the day it was written. The
  # job PRINTS what it ran, and the measured figures live in the CHANGELOG entry, which
  # is dated. This comment was caught by that arm before the job ever ran.
  #
  # TWO MAJORS HERE, FIVE NIGHTLY (#1163). This job ran on PG 18 alone while the shell
  # corpus ran on five, so half of a pair meant to assert the same properties had a
  # fifth of the major coverage. The deferral that shipped it said a matrix "would
  # multiply a cost nobody has measured yet"; the cost is measured now, and so is the
  # gap: a five-major gate on a port branch reddened
  # `test_a_query_that_cannot_use_the_order_does_not_pay_to_decide` on PG 15, an arm
  # that had never run on 15 anywhere -- not here, not nightly, not in
  # run_all_versions.sh -- so attributing it meant building a baseline from scratch.
  #
  # THE SHELL TWIN'S CLEAN NIGHTS DO NOT TRANSFER. The two halves differ structurally
  # in the relevant place: the shell suite runs each measurement in a FRESH psql
  # backend, the port runs both on ONE persistent connection, and that first-touch
  # catalog-cache cost is what the arm measures. Thirty clean PG 15 nights are evidence
  # about the shell instrument.
  #
  # The majors here match `suites` above, which already installs them in this workflow's
  # neighbours. The ends of the range -- 15, 16 and 19, which is where the gap was --
  # are covered by the nightly matrix rather than on every PR.
  #
  # conftest.py's default is an assert build that exists on the audit container and not
  # here, so the pg_config is passed explicitly.
  pytest-cluster:
    name: pytest (cluster tests, PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ['17', '18']
    steps:
      - uses: actions/checkout@v4

      - name: Add the PGDG repository and install PostgreSQL ${{ matrix.pg }} with its headers
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          # Bounded and retried, for the reason the suites job gives: a plain
          # "curl -fsSL" waits indefinitely on a stalled connection, which hung a
          # step for 40 minutes on an otherwise healthy runner (#351).
          sudo curl -fsSL --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo timeout 300 apt-get -o Acquire::Retries=5 update
          sudo timeout 600 apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} \
            liblz4-dev libzstd-dev zlib1g-dev
          # NOT cached, deliberately. The suites job caches because it runs a matrix for
          # an hour; a second copy of that cache-key derivation is a thing that goes
          # stale silently, and this job is minutes long.

      # ASSERTED, not assumed. A missing pg_config would otherwise surface as a
      # confusing failure inside conftest's build rather than here.
      - name: check the pg_config the tests will be given
        run: |
          set -euo pipefail
          PGC="/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config"
          test -x "$PGC"
          echo "pg_config: $PGC"
          "$PGC" --version
          # pgc_cluster.py runs initdb as THIS user; root cannot, and the runner is not
          # root. Said out loud because it is the assumption that breaks on a
          # container.
          echo "running as: $(id -un) (uid $(id -u))"
          test "$(id -u)" -ne 0

      # MAKE THE INSTALL TARGETS WRITABLE, because this job must stay non-root and
      # therefore cannot install. `make install` writes the .so to pkglibdir and the
      # control/SQL files to sharedir/extension, both root-owned on a PGDG install, so the
      # first run of this job failed inside conftest's build with
      #
      #     RuntimeError: pgcolumnar failed to build or install from ...;
      #                   refusing to report checks against whatever was installed before.
      #
      # Diagnosed by @jdatcmd, who also named why the suites job does not hit it: that one
      # runs the whole matrix under `sudo -E` and lib.sh drops to `runuser -u postgres` for
      # what must not be root. The pytest harness has no equivalent drop, so it is non-root
      # throughout -- initdb refuses to run as root, so it has to be.
      #
      # Of the three ways out, this is the one that KEEPS the non-root assertion above,
      # which is a decision rather than an accident.
      - name: make the extension's install targets writable by this user
        run: |
          set -euo pipefail
          PGC="/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config"
          LIB="$("$PGC" --pkglibdir)"
          SHARE="$("$PGC" --sharedir)"
          sudo chown -R "$(id -un)" "$LIB" "$SHARE"
          # ASSERTED, not assumed. A chown that changed nothing would surface as the same
          # opaque build failure this step exists to remove, two steps later and in
          # somebody else's traceback.
          test -w "$LIB"
          test -w "$SHARE/extension"
          echo "writable by $(id -un): $LIB and $SHARE/extension"

      - name: install pytest and the driver, pinned from requirements-test.txt
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pgcvenv
          # EVERY pin, including psycopg, which is what makes this job the other half of
          # pytest-guards. Installing "whatever the runner carries" is what
          # requirements-test.txt exists to prevent.
          /tmp/pgcvenv/bin/pip install --quiet -r test/pytest/requirements-test.txt
          # The control for pytest-guards' own assertion: that job proves the guard
          # files need no driver by its ABSENCE, so this one states its presence.
          /tmp/pgcvenv/bin/pip show psycopg >/dev/null

      - name: run the tests that need a cluster
        run: |
          set -euo pipefail
          cd test/pytest
          # THE COMPLEMENT of NO_CLUSTER, derived rather than written here. A second
          # hand-maintained copy of which file needs a database goes stale silently,
          # which is why pytest-guards derives its list from the same place.
          FILES="$(python3 -c 'import sys, pathlib; sys.path.insert(0, "."); from test_harness_deps import NO_CLUSTER; print(" ".join(p.name for p in sorted(pathlib.Path(".").glob("test_*.py")) if p.name not in NO_CLUSTER))')"
          test -n "$FILES"
          WANT="$(awk '$1=="cluster_tests"{print $2}' expected_tests.txt)"
          test -n "$WANT"
          echo "running $(set -- $FILES; echo $#) cluster file(s): $FILES"
          echo "expecting $WANT collected test(s)"
          PYTHONPATH=. /tmp/pgcvenv/bin/pytest -q \
            --pg-config /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config \
            --pgc-expect-tests "$WANT" \
            $FILES

  # Build against every supported major. Fast, and it is what an API change
  # between majors trips first.
  # Both architectures, because a build preflight is cheap and the project has
  # never compiled anywhere but x86_64 (#242). aarch64 is not covered by the
  # sanitizer gate's alignment checking, which reports a misaligned load on any
  # host: what a second architecture adds here is codegen and ABI differences at
  # compile time, and, in the nightly suite run, a weaker memory model than
  # x86_64's.
  build:
    name: build (PG ${{ matrix.pg }}, ${{ matrix.runner == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }})
    runs-on: ${{ matrix.runner }}
    # This job normally finishes in about 70 seconds. Without a bound, a stalled
    # package mirror leaves it running forever and the PR sits at "1 pending"
    # rather than failing, which pushes a reviewer toward merging on an
    # incomplete gate (#351). A gate that is routinely bypassed is not a gate.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Two dimensions, so this is a cross product: every major on both
      # architectures. Expressed as a second dimension rather than as include
      # entries, because an include entry carrying only new keys is merged into
      # the existing combinations instead of multiplying them, which would have
      # produced four jobs on one architecture rather than eight on two.
      matrix:
        pg: ['15', '16', '17', '18']
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      # The repository and the package lists first, on their own, because the
      # cache key below is derived from the versions apt resolves and cannot be
      # computed before the lists exist.
      - name: Add the PGDG repository and refresh the package lists
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          # Bounded and retried: plain "curl -fsSL" waits indefinitely on a
          # stalled connection, which is how this step came to hang for 40
          # minutes on an otherwise healthy runner (#351).
          sudo curl -fsSL --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          # Acquire retries cover a flaky mirror; the outer timeout keeps a
          # wedged one from consuming the whole job budget.
          sudo timeout 300 apt-get -o Acquire::Retries=5 update

      # The key has to track the package VERSIONS and not only their names.
      #
      # actions/cache skips its save step on an exact-key hit, so a fixed key
      # freezes the archives until a human edits it. On the day PGDG publishes a
      # new minor, the cache hits with the old debs, apt resolves to the new
      # ones and downloads them, and the assertion below sees a hit together
      # with a download and fails the job. Every entry in the matrix goes red on
      # a routine upstream release, and stays red until someone bumps the key by
      # hand. That is a false red on a monthly timer.
      #
      # Hashing the resolved candidate versions makes an upstream bump a new
      # key: it misses, downloads, and saves. The restore-keys prefix still
      # seeds it from the previous archives, so only the changed debs are
      # fetched. An exact hit then genuinely means nothing should be
      # downloaded, which is the property worth asserting.
      - name: Derive the cache key from the versions apt will install
        id: aptkey
        run: |
          set -euo pipefail
          v=$(apt-cache policy \
                postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} \
                liblz4-dev libzstd-dev zlib1g-dev \
              | awk '/Candidate:/ {print $2}' | sort)
          # $ImageOS, from the shell, where it actually has a value. Reported
          # rather than only hashed, so an empty one is visible in the log
          # instead of silently hashing to a constant.
          echo "runner image: ${ImageOS:-<empty>}   candidates:"; echo "$v" | sed 's/^/  /'
          # Both inputs must be non-empty. A hash of nothing is a constant, and a
          # constant silently restores the frozen key this step exists to remove.
          # An empty ImageOS is how the runner-image protection went missing the
          # first time, and folding in a placeholder instead of failing is how it
          # would go missing again.
          test -n "$v"
          test -n "${ImageOS:-}"
          h=$(printf '%s\n%s\n' "$ImageOS" "$v" | md5sum | cut -c1-12)
          echo "k=$h" >> "$GITHUB_OUTPUT"
          echo "cache key hash: $h"

      # The packages are ~102 MB, of which ~91 MB is the LLVM toolchain that
      # postgresql-server-dev-N depends on. That download is what stalls: every
      # failure of this step sat at the 600s bound while every success finished
      # in a median of 25s (#386). Caching the debs removes the download on a
      # hit, and a miss degrades to exactly what happens today.
      #
      # The runner image is folded into the hash below, not into the literal key.
      # A new image can bring a different LLVM major, and a key that ignored it
      # would serve debs for the wrong one. It was in the literal key as
      # ${{ env.ImageOS }} and expanded to NOTHING every time: ImageOS is a
      # runner environment variable, and the env context only carries variables
      # set by the workflow, job, or step. The observed key was
      # apt-pgdev-codecs-pg15-Linux-X64--v1, with an empty component between the
      # two dashes. The shell in the hash step can see $ImageOS; an expression
      # context cannot.
      - name: Cache the PostgreSQL ${{ matrix.pg }} and codec headers packages
        id: apt-build
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-pgdev-codecs-pg${{ matrix.pg }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.aptkey.outputs.k }}-v3
          restore-keys: |
            apt-pgdev-codecs-pg${{ matrix.pg }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install PostgreSQL ${{ matrix.pg }} and codec headers
        run: |
          set -euo pipefail
          mkdir -p "$HOME/apt-archives/partial"
          sudo timeout 600 apt-get -o Acquire::Retries=5 \
            -o Dir::Cache::archives="$HOME/apt-archives" install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} \
            liblz4-dev libzstd-dev zlib1g-dev 2>&1 | tee /tmp/apt-install.log
          # apt downloads as _apt, so the debs and partial/ are not owned by the
          # runner user and the post-job save cannot read them. This is not
          # allowed to fail quietly. A failed chown means the save fails, the
          # cache is never populated, there is never a hit, and the assertion
          # below never fires, because it is gated on a hit. Permanently slow
          # and permanently green is the failure this whole step is about.
          sudo chown -R "$USER" "$HOME/apt-archives"
          test -r "$HOME/apt-archives"
          # A cache that populates but never hits looks identical in the log to one
          # that works: the job is simply still slow. So assert it. On an exact
          # hit, apt must not have fetched anything over the network.
          #
          # A restore-keys prefix match reports cache-hit false, so a partial
          # restore that downloads the changed debs is not caught here. That is
          # correct: it is supposed to download them.
          if [ "${{ steps.apt-build.outputs.cache-hit }}" = "true" ] \
             && grep -qE '^Get:[0-9]+ https?://' /tmp/apt-install.log; then
            echo "::error::apt cache reported a hit but packages were downloaded anyway"
            grep -E '^Get:[0-9]+ https?://' /tmp/apt-install.log
            exit 1
          fi

      - name: Build, treating warnings as failures
        run: |
          set -euo pipefail
          PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          "$PG_CONFIG" --version
          make PG_CONFIG="$PG_CONFIG" 2> build.err || { cat build.err; exit 1; }
          if grep -q 'warning:' build.err; then
            echo "::error::compiler warnings are failures in this project"
            grep 'warning:' build.err
            exit 1
          fi
          cat build.err || true

      - name: Verify the module's symbols resolve against the server
        run: |
          set -euo pipefail
          BIN=$(/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config --bindir)
          missing=$(nm -D --undefined-only pgcolumnar.so \
                    | awk '{print $2}' | sort -u \
                    | while read -r s; do
                        nm -D --defined-only "$BIN/postgres" 2>/dev/null \
                          | grep -q " $s\$" || echo "$s"
                      done | grep -vE '^(_|__|GLIBC)' | head -20 || true)
          # Informational: the local gate does this strictly, and the packaged
          # server exports a different set than a source build, so a difference
          # here is reported rather than failed on.
          [ -z "$missing" ] && echo "all resolve" || { echo "unresolved (informational):"; echo "$missing"; }

  # Compile against the newest major, built from source because PGDG does not
  # package a beta.
  #
  # This exists because of a defect it would have caught. A set-returning function
  # added to the extension used tuplestore_begin_heap without including
  # utils/tuplestore.h, which arrives transitively behind funcapi.h through
  # PostgreSQL 18 and does not on 19. It compiled clean on every major CI could
  # install and failed only on the one it could not, so the per-PR gate reported
  # green on a tree that did not build. The local five-major matrix caught it
  # before merge; nothing in CI would have.
  #
  # Build only, not suites. A compile is what catches this class, and it is cheap:
  # the PostgreSQL build is cached, so a hit costs about as long as compiling the
  # extension. The suites on 19 stay local, where the beta can be validated
  # against a full matrix.
  build-beta:
    name: build (PG 19 beta, from source)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_BETA: 19beta2
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # gcc-14 explicitly, so one compiler configures PostgreSQL and builds
          # the extension.
          #
          # PGXS hands the extension the CFLAGS the server was configured with,
          # and PostgreSQL's configure adapts those to its compiler. Configuring
          # with a newer GCC and building with an older one therefore feeds the
          # older compiler warning flags it does not have: gcc-15 adds
          # -Wmissing-variable-declarations, which gcc-13 rejects outright.
          # Pinning one compiler for both removes the mismatch.
          #
          # This is NOT where -std=gnu23 came from. That flag is set by this
          # project's own Makefile for PostgreSQL 19, whose headers use C23
          # constructs, and the Makefile now probes for the spelling the
          # compiler accepts. See #294.
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-14 flex bison libreadline-dev zlib1g-dev \
            liblz4-dev libzstd-dev pkg-config

      - name: Cache the PostgreSQL beta build
        id: cache-beta
        uses: actions/cache@v4
        with:
          path: ~/pgbeta
          key: pgbeta-${{ env.PG_BETA }}-gcc14-${{ runner.os }}-${{ runner.arch }}

      - name: Build PostgreSQL ${{ env.PG_BETA }} (on cache miss)
        if: steps.cache-beta.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src=$(mktemp -d)
          # The beta tarballs live beside the release ones and are not moved when
          # the next beta appears, so pinning the version pins the bytes.
          curl -fsSL "https://ftp.postgresql.org/pub/source/v${PG_BETA}/postgresql-${PG_BETA}.tar.bz2" \
            | tar -xj -C "$src" --strip-components=1
          cd "$src"
          # Only what PGXS needs: pg_config, the headers, and the makefiles. ICU
          # and readline are dropped to keep the dependency list to what the
          # extension itself already requires.
          ./configure CC=gcc-14 --prefix="$HOME/pgbeta" --without-icu \
            --without-readline --without-zlib --enable-debug >/dev/null
          make -j"$(nproc)" -C src >/dev/null
          make -C src install >/dev/null
          "$HOME/pgbeta/bin/pg_config" --version

      - name: Build the extension, treating warnings as failures
        run: |
          set -euo pipefail
          PG_CONFIG="$HOME/pgbeta/bin/pg_config"
          "$PG_CONFIG" --version
          # Same compiler PostgreSQL was configured with, so the flags in
          # Makefile.global are ones this compiler understands.
          make CC=gcc-14 PG_CONFIG="$PG_CONFIG" 2> build.err || { cat build.err; exit 1; }
          if grep -q 'warning:' build.err; then
            echo "::error::compiler warnings are failures in this project"
            grep 'warning:' build.err
            exit 1
          fi
          cat build.err || true

  # Run the suites on the current majors (17 + 18). This is the per-PR behaviour
  # gate; the full packaged matrix (15-18) runs nightly, and the local five-major
  # matrix (adding PG19) remains the release gate. The two majors run in parallel.
  suites:
    name: suites (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pg: ['17', '18']
    steps:
      - uses: actions/checkout@v4

      # THE LEDGER GATE NEEDS THE BASE BRANCH TO EXIST (#918). It compares the
      # tracked ceiling in `test/check_ledger_budget.txt` against the one already
      # on the PR's target, and it FAILS CLOSED when no trustworthy prior can be
      # read rather than quietly enforcing less.
      #
      # actions/checkout fetches one ref at depth 1, so without this the base is
      # absent and the gate stops the run -- correctly, but for a reason that is
      # this workflow's to fix rather than the author's. Depth 1 is enough: only
      # the file at that commit is read.
      - name: fetch the PR base, for the ledger ceiling comparison
        if: github.base_ref != ''
        run: |
          git fetch --depth=1 origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      # The repository and the package lists first, on their own, because the
      # cache key below is derived from the versions apt resolves and cannot be
      # computed before the lists exist.
      - name: Add the PGDG repository and refresh the package lists
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          # Bounded and retried: plain "curl -fsSL" waits indefinitely on a
          # stalled connection, which is how this step came to hang for 40
          # minutes on an otherwise healthy runner (#351).
          sudo curl -fsSL --connect-timeout 15 --max-time 120 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          # Acquire retries cover a flaky mirror; the outer timeout keeps a
          # wedged one from consuming the whole job budget.
          sudo timeout 300 apt-get -o Acquire::Retries=5 update

      # See the build job for why the key hashes the resolved versions: a fixed
      # key freezes the archives, and the next routine PGDG minor then turns the
      # download assertion below into a false red across the whole matrix.
      - name: Derive the cache key from the versions apt will install
        id: aptkey
        run: |
          set -euo pipefail
          v=$(apt-cache policy \
                postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} \
                liblz4-dev libzstd-dev zlib1g-dev python3-pip \
              | awk '/Candidate:/ {print $2}' | sort)
          # $ImageOS, from the shell, where it actually has a value. Reported
          # rather than only hashed, so an empty one is visible in the log
          # instead of silently hashing to a constant.
          echo "runner image: ${ImageOS:-<empty>}   candidates:"; echo "$v" | sed 's/^/  /'
          # Both inputs must be non-empty. A hash of nothing is a constant, and a
          # constant silently restores the frozen key this step exists to remove.
          # An empty ImageOS is how the runner-image protection went missing the
          # first time, and folding in a placeholder instead of failing is how it
          # would go missing again.
          test -n "$v"
          test -n "${ImageOS:-}"
          h=$(printf '%s\n%s\n' "$ImageOS" "$v" | md5sum | cut -c1-12)
          echo "k=$h" >> "$GITHUB_OUTPUT"
          echo "cache key hash: $h"

      # The packages are ~102 MB, of which ~91 MB is the LLVM toolchain that
      # postgresql-server-dev-N depends on. That download is what stalls: every
      # failure of this step sat at the 600s bound while every success finished
      # in a median of 25s (#386). Caching the debs removes the download on a
      # hit, and a miss degrades to exactly what happens today.
      #
      # The runner image is folded into the hash below, not into the literal key.
      # A new image can bring a different LLVM major, and a key that ignored it
      # would serve debs for the wrong one. It was in the literal key as
      # ${{ env.ImageOS }} and expanded to NOTHING every time: ImageOS is a
      # runner environment variable, and the env context only carries variables
      # set by the workflow, job, or step. The observed key was
      # apt-pgdev-codecs-pg15-Linux-X64--v1, with an empty component between the
      # two dashes. The shell in the hash step can see $ImageOS; an expression
      # context cannot.
      - name: Cache the PostgreSQL ${{ matrix.pg }}, codec headers, and pyarrow packages
        id: apt-suites
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-pgdev-codecs-pyarrow-pg${{ matrix.pg }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.aptkey.outputs.k }}-v3
          restore-keys: |
            apt-pgdev-codecs-pyarrow-pg${{ matrix.pg }}-${{ runner.os }}-${{ runner.arch }}-

      - name: Install PostgreSQL ${{ matrix.pg }}, codec headers, and pyarrow
        run: |
          set -euo pipefail
          mkdir -p "$HOME/apt-archives/partial"
          sudo timeout 600 apt-get -o Acquire::Retries=5 \
            -o Dir::Cache::archives="$HOME/apt-archives" install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }} \
            liblz4-dev libzstd-dev zlib1g-dev python3-pip 2>&1 | tee /tmp/apt-install.log
          # The Arrow and Parquet suites use pyarrow as an independent reader and
          # skip themselves without it, which would be a silent loss of coverage.
          # Installed with sudo on purpose. The suites run under sudo, so the
          # interpreter that must find pyarrow is root's. A plain "pip3 install"
          # as the runner lands in ~/.local and root cannot see it, which is
          # exactly how the Arrow and Parquet suites came to report PASS in CI
          # while skipping themselves.
          sudo pip3 install --break-system-packages --quiet pyarrow \
            || sudo pip3 install --quiet pyarrow
          # apt downloads as _apt, so the debs and partial/ are not owned by the
          # runner user and the post-job save cannot read them. This is not
          # allowed to fail quietly. A failed chown means the save fails, the
          # cache is never populated, there is never a hit, and the assertion
          # below never fires, because it is gated on a hit. Permanently slow
          # and permanently green is the failure this whole step is about.
          sudo chown -R "$USER" "$HOME/apt-archives"
          test -r "$HOME/apt-archives"
          # A cache that populates but never hits looks identical in the log to one
          # that works: the job is simply still slow. So assert it. On an exact
          # hit, apt must not have fetched anything over the network.
          #
          # A restore-keys prefix match reports cache-hit false, so a partial
          # restore that downloads the changed debs is not caught here. That is
          # correct: it is supposed to download them.
          if [ "${{ steps.apt-suites.outputs.cache-hit }}" = "true" ] \
             && grep -qE '^Get:[0-9]+ https?://' /tmp/apt-install.log; then
            echo "::error::apt cache reported a hit but packages were downloaded anyway"
            grep -E '^Get:[0-9]+ https?://' /tmp/apt-install.log
            exit 1
          fi

      - name: Confirm pyarrow is importable by the suites' interpreter
        # Installing pyarrow and having the suites SEE it are different facts. The
        # Arrow and Parquet suites skip themselves when the import fails, so a
        # pip/interpreter skew turns those suites green without running them --
        # a silent loss of exactly the coverage they exist for. The suites run
        # under sudo, so check the import as root too, not only as the runner.
        run: |
          set -euo pipefail
          python3 -c 'import pyarrow, pyarrow.parquet; print("pyarrow", pyarrow.__version__)'
          sudo python3 -c 'import pyarrow, pyarrow.parquet; print("pyarrow as root ok")'

      - name: Resolve the object-storage suite host names
        # objstore_addressing and objstore_listing exercise virtual-host-style
        # S3 addressing (pgc-bucket.s3.local) against their own loopback
        # fixture server. The names must resolve; a suite whose capability
        # check fails is a FAILURE unless explicitly waived (pgc_skip), so
        # resolution is part of the environment the gate provides.
        run: echo "127.0.0.1 s3.local pgc-bucket.s3.local" | sudo tee -a /etc/hosts

      - name: Stop the packaged cluster
        # The suites start their own throwaway clusters on private ports; the
        # packaged one is unused and only competes for shared memory.
        run: sudo systemctl stop postgresql || true

      - name: Run the suite matrix on PG ${{ matrix.pg }}
        run: |
          set -euo pipefail
          # PGC_SKIP_TIMING drops the four wall-clock suites: a shared runner
          # cannot hold a ratio still, and a gate that reds for reasons unrelated
          # to the change is worse than one that does not run. They stay in the
          # local matrix, which is where those numbers mean anything.
          # PGC_JOBS is sized for a 4-core runner rather than the local 8.
          # PGC_REQUIRE_ISOLATION turns a missing pg_isolation_regress into a
          # failure instead of a skip (#247), so the seven columnar race specs
          # cannot report green without executing.
          sudo -E env "PATH=$PATH" PGC_SKIP_TIMING=1 PGC_JOBS=4 \
            PGC_REQUIRE_ISOLATION=1 \
            bash test/run_all_versions.sh /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Collect logs on failure
        if: failure()
        run: |
          # /tmp/pgcolumnar-logs, not the build directory: the runner removes
          # each builddir at the end of its major, so this step used to search a
          # path that no longer existed and print nothing.
          # A FAILING SUITE'S LOG IS PRINTED WHOLE; A PASSING ONE IS NOT PRINTED
          # AT ALL (#1248). `tail -60` was too small for the suite that needed
          # it: harness_selftest emits 2452 lines and its hand-rebuild premise
          # sits 76 from the end, so the window missed the failure -- and the
          # diagnosis printed just after it -- by 16 lines. Raising the number
          # would go stale the next time a part is added after 590, which is
          # how it went stale the first time.
          #
          # Printing only the logs that carry a FAIL is also far less output:
          # 268 tails of 60 is ~16000 lines of mostly passing suites, against
          # one failing suite's 2452 that actually contains the answer.
          for f in /tmp/pgcolumnar-logs/*.log /tmp/pgcolumnar-matrix-*/*.log; do
            [ -e "$f" ] || continue
            # awk, not grep: this is the SAME expression used to validate the
            # selector, so the guard and its check cannot disagree -- which is
            # exactly what happened. The first version wrote `\t` in a POSIX
            # BRE, where GNU grep matches a literal `t`, so it selected nothing
            # on CI; and `if: failure()` means a green run never runs this step,
            # so it would have looked fixed until the next red printed nothing.
            awk -F'\t' '$5 == "FAIL" { found = 1 } END { exit !found }' "$f" || continue
            echo "===== $f (whole log: it carries a FAIL) ====="
            cat "$f"
          done
